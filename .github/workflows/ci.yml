name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e .
      - run: ruff check .
      - run: pytest -q
      - run: python -c "from creditrisk.models import candidates; assert len(candidates(42, 1)) == 5"
